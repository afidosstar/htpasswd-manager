# Stack Docker Swarm : htpasswd-manager + Mailpit (image officielle) rechargé automatiquement.
#
#   docker stack deploy -c examples/swarm/stack.yml htpasswd
#
# Mailpit ne lit le fichier d'authentification qu'au démarrage. htpasswd-watch, fourni par une
# config Swarm, le relance à chaque modification (2 s environ), sans accès à /var/run/docker.sock.
#
# Le script doit être à la même version que l'image htpasswd-manager. Extraction depuis l'image :
#   docker run --rm --entrypoint cat afidos/htpasswd-manager:1.0.0 \
#     /usr/local/bin/htpasswd-watch > htpasswd-watch
#
# Les configs Swarm sont immuables : changez le nom (htpasswd-watch-1.0.0 -> -1.1.0) à chaque version.

services:
  htpasswd-manager:
    image: afidos/htpasswd-manager:1.0.0
    environment:
      HTPASSWD_PATH: /data/passwords
      ADMIN_USER_FILE: /run/secrets/htpasswd_admin_user
      ADMIN_PASSWORD_FILE: /run/secrets/htpasswd_admin_password
      TRUST_PROXY: "true"           # derrière le reverse proxy (IP client pour le verrouillage)
      COOKIE_SECURE: "true"         # interface servie en HTTPS par le proxy
    secrets:
      - htpasswd_admin_user
      - htpasswd_admin_password
    volumes:
      - htpasswd-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop: [ALL]
    networks: [htpasswd-net]
    deploy:
      replicas: 1                   # sessions en mémoire : une seule réplique
      placement:
        constraints: [node.labels.htpasswd == true]
      restart_policy:
        condition: any

  mailpit:
    image: axllent/mailpit:latest   # épinglez une version précise
    init: true
    entrypoint: ["/bin/sh", "/usr/local/bin/htpasswd-watch", "--", "/mailpit"]
    environment:
      HTPASSWD_WATCH_FILE: /auth/passwords
      MP_UI_AUTH_FILE: /auth/passwords
      MP_SMTP_AUTH_FILE: /auth/passwords
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Base persistante : sans elle, les messages sont perdus à chaque relance.
      MP_DATABASE: /data/mailpit.db
    configs:
      - source: htpasswd-watch
        target: /usr/local/bin/htpasswd-watch
        mode: 0555
    volumes:
      - htpasswd-data:/auth:ro
      - mailpit-data:/data
    networks: [htpasswd-net]
    deploy:
      replicas: 1
      placement:
        # Volumes locaux : même nœud que htpasswd-manager.
        constraints: [node.labels.htpasswd == true]
      restart_policy:
        condition: any

configs:
  htpasswd-watch:
    name: htpasswd-watch-1.0.0
    file: ./htpasswd-watch          # extrait de l'image (voir en-tête)

secrets:
  htpasswd_admin_user:
    external: true
  htpasswd_admin_password:
    external: true

volumes:
  htpasswd-data:
  mailpit-data:

networks:
  htpasswd-net:
    driver: overlay
